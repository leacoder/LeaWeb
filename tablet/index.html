<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LG Design · Nueva web</title>
    <meta name="description" content="Visitá la nueva web de LG Design: diseño y desarrollo digital para hacer avanzar tu proyecto.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://lgdesign.com.ar/">
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #071d34; color: #f5f8ff; }
      main { max-width: 40rem; padding: 2rem; }
      h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; }
      p { color: #c3d4e6; line-height: 1.7; }
      a { display: inline-block; color: #a8e8ff; font-weight: 700; text-underline-offset: .3em; }
      a:focus-visible { outline: 3px solid #a8e8ff; outline-offset: 6px; }
    </style>
  </head>
  <body>
    <main>
      <p>LG DESIGN / DISEÑO + DESARROLLO</p>
      <h1>Tenemos una nueva web.</h1>
      <p>El portfolio ahora se adapta a tu pantalla. Seguí al sitio para conocer los servicios, ver proyectos o contactarme.</p>
      <a id="new-site" href="/">Ir a LG Design →</a>
    </main>
    <script>
      const destination = new URL('/', window.location.origin);
      destination.hash = window.location.hash;
      document.getElementById('new-site').href = destination.href;
      window.location.replace(destination.href);
    </script>
  </body>
</html>
